[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memosight"
version = "0.2.1"
description = "Local-first image-to-structured-visual-text module and CLI: image source -> validated structured visual observation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kanzhi Wu" },
]
keywords = [
    "vision-language-model",
    "mlx",
    "image-understanding",
    "structured-output",
    "local-first",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "build>=1",
]

[project.scripts]
memosight = "memosight.cli:main"

[project.urls]
Homepage = "https://github.com/MemoBloom/MemoSight"
Repository = "https://github.com/MemoBloom/MemoSight"
Issues = "https://github.com/MemoBloom/MemoSight/issues"

[tool.setuptools.packages.find]
include = ["memosight*"]

[tool.setuptools.package-data]
memosight = ["config/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
