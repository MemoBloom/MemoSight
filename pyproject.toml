[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memosight"
version = "0.1.0"
description = "Reusable image-to-structured-visual-text module: image source -> validated structured visual observation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["memosight*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
